name: Terraform CI - Lint

on:
  [push]

jobs:
  tf_lint:
    name: 'Terraform lint (on tf ${{ matrix.terraform_version }})'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # fmt is stable across releases; oldest supported + latest is enough
        terraform_version: [ '~1.1.0', 'latest' ]
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: 'setup Terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform_version }}

      - name: 'lint Terraform code'
        # see https://www.terraform.io/cli/commands/fmt
        run:
          terraform fmt -check -recursive -diff .
