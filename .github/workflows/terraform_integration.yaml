name: Terraform CI - Integration

on:
  pull_request:
  push:
    branches:
      - main
      - 'rc-*'

# Only one integration run per ref; cancel superseded runs so applies don't pile up
# against the shared CI AWS account.
concurrency:
  group: tf-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tf_integration:
    name: 'Terraform integration (tf=${{ matrix.terraform_version }}, aws=${{ matrix.aws_provider_version }})'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    strategy:
      fail-fast: false
      # Limit parallel applies/destroys against the shared CI account.
      max-parallel: 2
      matrix:
        terraform_version:
          # oldest supported, a couple intermediates, and latest pin
          # (1.0 excluded: the `moved` block requires Terraform >= 1.1)
          - 1.1.9
          - 1.5.7
          - 1.10.5
          - 1.15.1
        aws_provider_version:
          # ends of the supported major range; middle majors assumed OK if these pass
          - '~> 3.0'
          # - '~> 4.0'
          # - '~> 5.0'
          - '~> 6.0'
    env:
      CI_SA_EMAIL: gh-actions-tf-aws-export@worklytics-corp.iam.gserviceaccount.com
      GCP_IDENTITY_POOL: 'projects/432357880585/locations/global/workloadIdentityPools/github-actions/providers/github'
      EXAMPLE_TENANT_SA_EMAIL: tf-aws-export-tenant@worklytics-ci.iam.gserviceaccount.com
      EXAMPLE_TENANT_SA_ID: '104184075060961394622'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AWS_REGION: 'us-west-2'
      AWS_ACCOUNT_ID: '626567183302'
    steps:
      - name: Get timestamp
        id: timestamp
        run: |
          echo "timestamp=$(date  +%Y%m%d'T'%H%M%S)" >> $GITHUB_ENV

      - name: Check out code
        uses: actions/checkout@v6

      - name: 'setup Terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform_version }}
          terraform_wrapper: false

      - id: 'auth-gcp'
        name: 'Authenticate to Google Cloud'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_IDENTITY_POOL }}
          service_account: ${{ env.CI_SA_EMAIL }}

      # see : https://github.com/aws-actions/configure-aws-credentials
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::626567183302:role/gh_action_ci_agent
          role-session-name: github_ci
          aws-region: ${{ env.AWS_REGION }}

      - name: 'Pin AWS provider version for test matrix'
        # Writes a standalone required_providers declaration so terraform init
        # resolves exactly the provider series under test. GitHub Actions
        # expands ${{ }} before the shell runs, so the HCL literal is safe.
        # The intersection with the module's ">= 3.0" floor is also satisfied.
        working-directory: examples/basic
        run: |
          cat > aws_provider_version_test.tf << 'TFEOF'
          terraform {
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "${{ matrix.aws_provider_version }}"
              }
            }
          }
          TFEOF

      - name: 'Terraform - integration test examples/basic apply'
        id: terraform_apply
        working-directory: examples/basic
        run: |
          RESOURCE_PREFIX=$(echo -n "${{ matrix.terraform_version }}_${{ matrix.aws_provider_version }}_${{ env.timestamp}}" | sha1sum | cut -c1-12)
          RESOURCE_NAME_PREFIX="ci_tf_aws_${RESOURCE_PREFIX}"
          terraform init
          terraform apply -auto-approve \
            -var="aws_account_id=${{ env.AWS_ACCOUNT_ID }}" \
            -var="resource_name_prefix=${RESOURCE_NAME_PREFIX}" \
            -var="worklytics_tenant_id=${{ env.EXAMPLE_TENANT_SA_ID }}"
          echo "resource_name_prefix=${RESOURCE_NAME_PREFIX}" >> $GITHUB_OUTPUT
          echo "worklytics_export_bucket_id=$(terraform output -raw worklytics_export_bucket_id)" >> $GITHUB_OUTPUT
          echo "worklytics_tenant_aws_role_arn=$(terraform output -raw worklytics_tenant_aws_role_arn)" >> $GITHUB_OUTPUT

      - name: 'Terraform - integration test examples/basic s3 write'
        run: |
          ./test/rsync.sh ${{ env.EXAMPLE_TENANT_SA_EMAIL }} ${{ steps.terraform_apply.outputs.worklytics_export_bucket_id }} ${{ steps.terraform_apply.outputs.worklytics_tenant_aws_role_arn }}

      - name: 'Terraform - integration test examples/basic terraform destroy'
        if: always() # try to force this to ALWAYS happen, no matter if previous stuff failed
        working-directory: examples/basic
        run: |
          aws s3 rm s3://${{ steps.terraform_apply.outputs.worklytics_export_bucket_id }} --recursive
          terraform destroy -auto-approve \
            -var="aws_account_id=${{ env.AWS_ACCOUNT_ID }}" \
            -var="worklytics_tenant_id=${{ env.EXAMPLE_TENANT_SA_ID }}" \
            -var="resource_name_prefix=${{ steps.terraform_apply.outputs.resource_name_prefix }}"
