# Categories for GitHub's "Generate release notes" button in the UI.
# The tag workflow uses scripts/generate-release-notes.sh instead, which also
# drops the "New Contributors" section.
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
      - dependabot[bot]
      - github-actions
      - github-actions[bot]
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
        - Semver-Major
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Tests & CI
      labels:
        - test
        - ci
    - title: Other changes
      labels:
        - "*"
